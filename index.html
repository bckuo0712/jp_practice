<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>50音 AI 練字王 - 完整 46 音版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { 
            position: fixed; overflow: hidden; width: 100%; height: 100%; 
            touch-action: none; background-color: #020617; color: #f8fafc; font-family: sans-serif; 
        }
        .canvas-box { 
            position: relative; width: 320px; height: 190px; 
            background-color: #1e293b; border: 3px solid #334155; 
            border-radius: 20px; overflow: hidden; margin-bottom: 8px;
            transition: all 0.2s;
        }
        .is-correct { border-color: #22c55e !important; background-color: #052e16 !important; }
        .is-error { border-color: #ef4444 !important; }
        
        .hint-text {
            position: absolute; inset: 0; display: flex; align-items: center; 
            justify-content: center; font-size: 7rem; font-family: "MS Mincho", "Sawarabi Mincho", serif; 
            font-weight: 900; z-index: 0; pointer-events: none; opacity: 0.12;
        }
        canvas { position: absolute; inset: 0; z-index: 10; touch-action: none; background: transparent; }
        .active-mode { background-color: #3b82f6; color: white; }
        
        .loading-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        select { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 10px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body class="flex flex-col items-center p-2">

    <!-- 控制列 -->
    <div class="flex items-center space-x-2 mb-2 mt-2 w-full max-w-[320px]">
        <div class="flex bg-slate-800 rounded-xl p-1 flex-1">
            <button id="p-mode" onclick="setMode('practice')" class="flex-1 py-1 rounded-lg active-mode font-bold text-xs">練習</button>
            <button id="e-mode" onclick="setMode('exam')" class="flex-1 py-1 rounded-lg font-bold text-slate-400 text-xs">挑戰</button>
        </div>
        <select id="row-select" onchange="filterData()" class="flex-1">
            <option value="all">全部五十音</option>
            <option value="0,5">あ行 (a...)</option>
            <option value="5,10">か行 (ka...)</option>
            <option value="10,15">さ行 (sa...)</option>
            <option value="15,20">た行 (ta...)</option>
            <option value="20,25">な行 (na...)</option>
            <option value="25,30">は行 (ha...)</option>
            <option value="30,35">ま行 (ma...)</option>
            <option value="35,38">や行 (ya...)</option>
            <option value="38,43">ら行 (ra...)</option>
            <option value="43,46">わ行/ん</option>
        </select>
    </div>

    <div id="target-romaji" class="text-6xl font-black text-blue-500 mb-1 uppercase italic tracking-tighter">A</div>

    <!-- 平假名區域 -->
    <div class="canvas-box" id="boxH">
        <div class="hint-text text-slate-400" id="hint-hira">あ</div>
        <canvas id="canH" width="320" height="190"></canvas>
    </div>

    <!-- 片假名區域 -->
    <div class="canvas-box" id="boxK">
        <div class="hint-text text-slate-500" id="hint-kata">ア</div>
        <canvas id="canK" width="320" height="190"></canvas>
    </div>

    <div id="status-msg" class="h-6 text-sm font-bold mb-4 text-slate-500 uppercase tracking-widest text-center">READY</div>

    <!-- 操作按鈕 -->
    <div class="flex space-x-3 w-full max-w-[320px]">
        <button onclick="resetAll()" class="flex-1 bg-slate-800 py-4 rounded-2xl font-bold text-slate-300 active:scale-95 transition-transform">清除</button>
        <button onclick="nextQ()" class="flex-1 bg-blue-900/30 text-blue-400 py-4 rounded-2xl font-bold active:scale-95 transition-transform">跳過</button>
    </div>

    <script>
