<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>50音 AI 練字王 - 靈敏優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { 
            position: fixed; overflow: hidden; width: 100%; height: 100%; 
            touch-action: none; background-color: #020617; color: #f8fafc; font-family: sans-serif; 
        }
        .canvas-box { 
            position: relative; width: 320px; height: 210px; 
            background-color: #1e293b; border: 3px solid #334155; 
            border-radius: 20px; overflow: hidden; margin-bottom: 12px;
            transition: all 0.2s;
        }
        .is-correct { border-color: #22c55e !important; background-color: #052e16 !important; }
        .is-error { border-color: #ef4444 !important; }
        
        .hint-text {
            position: absolute; inset: 0; display: flex; align-items: center; 
            justify-content: center; font-size: 8rem; font-family: serif; 
            font-weight: 900; z-index: 0; pointer-events: none; opacity: 0.12;
        }
        canvas { position: absolute; inset: 0; z-index: 10; touch-action: none; background: transparent; }
        .active-mode { background-color: #3b82f6; color: white; }
        
        .loading-dot { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div class="flex bg-slate-800 rounded-xl p-1 mb-2 w-64 mt-2">
        <button id="p-mode" onclick="setMode('practice')" class="flex-1 py-1 rounded-lg active-mode font-bold text-xs">練習</button>
        <button id="e-mode" onclick="setMode('exam')" class="flex-1 py-1 rounded-lg font-bold text-slate-400 text-xs">挑戰</button>
    </div>

    <div id="target-romaji" class="text-6xl font-black text-blue-500 mb-2 uppercase italic tracking-tighter">A</div>

    <div class="canvas-box" id="boxH">
        <div class="hint-text text-slate-400" id="hint-hira">あ</div>
        <canvas id="canH" width="320" height="210"></canvas>
    </div>

    <div class="canvas-box" id="boxK">
        <div class="hint-text text-slate-500" id="hint-kata">ア</div>
        <canvas id="canK" width="320" height="210"></canvas>
    </div>

    <div id="status-msg" class="h-6 text-sm font-bold mb-4 text-slate-500 uppercase tracking-widest">READY</div>

    <div class="flex space-x-3 w-full max-w-[320px]">
        <button onclick="resetAll()" class="flex-1 bg-slate-800 py-4 rounded-2xl font-bold text-slate-300">清除</button>
        <button onclick="nextQ()" class="flex-1 bg-blue-900/30 text-blue-400 py-4 rounded-2xl font-bold">跳過</button>
    </div>

    <script>
        const kanaData = [
            { h: 'あ', k: 'ア', r: 'a' }, { h: 'い', k: 'イ', r: 'i' }, { h: 'う', k: 'ウ', r: 'u' },
            { h: 'え', k: 'エ', r: 'e' }, { h: 'お', k: 'オ', r: 'o' }, { h: 'か', k: 'カ', r: 'ka' },
            { h: 'き', k: 'キ', r: 'ki' }, { h: 'く', k: 'ク', r: 'ku' }, { h: 'け', k: 'ケ', r: 'ke' },
            { h: 'こ', k: 'コ', r: 'ko' }
        ];

        let curIdx = 0, mode = 'practice';
        let strokesH = [], strokesK = [];
        let hiraDone = false, kataDone = false;
        
        const canH = document.getElementById('canH'), ctxH = canH.getContext('2d');
        const canK = document.getElementById('canK'), ctxK = canK.getContext('2d');

        function initCtx(ctx) {
            ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#ffffff';
        }
        initCtx(ctxH); initCtx(ctxK);

        function setupCanvas(can, strokes, type) {
            let drawing = false;
            let timer = null;
            const ctx = can.getContext('2d');
            const box = document.getElementById(type === 'H' ? 'boxH' : 'boxK');
            
            const getXY = (e) => {
                const rect = can.getBoundingClientRect();
                const cx = (e.touches ? e.touches[0].clientX : e.clientX);
                const cy = (e.touches ? e.touches[0].clientY : e.clientY);
                return { x: cx - rect.left, y: cy - rect.top };
            };

            can.addEventListener('touchstart', (e) => {
                e.preventDefault();
                clearTimeout(timer);
                drawing = true;
                box.classList.remove('is-error');
                const p = getXY(e);
                ctx.beginPath(); ctx.moveTo(p.x, p.y);
                strokes.push([[p.x], [p.y], []]);
            }, { passive: false });

            can.addEventListener('touchmove', (e) => {
                if (!drawing) return;
                e.preventDefault();
                const p = getXY(e);
                ctx.lineTo(p.x, p.y); ctx.stroke();
                const last = strokes[strokes.length - 1];
                last[0].push(p.x); last[1].push(p.y);
            }, { passive: false });

            const stop = () => { 
                if (!drawing) return; 
                drawing = false; 
                // 調整：延遲縮短至 900ms (0.9秒)
                timer = setTimeout(() => checkSingle(type), 900); 
            };
            can.addEventListener('touchend', stop);
            can.addEventListener('mousedown', (e) => { 
                clearTimeout(timer);
                drawing = true; 
                const p = getXY(e); 
                ctx.beginPath(); ctx.moveTo(p.x, p.y); 
                strokes.push([[p.x], [p.y], []]); 
            });
            can.addEventListener('mousemove', (e) => { 
                if (drawing) { 
                    const p = getXY(e); 
                    ctx.lineTo(p.x, p.y); ctx.stroke(); 
                    const last = strokes[strokes.length - 1]; 
                    last[0].push(p.x); last[1].push(p.y); 
                } 
            });
            window.addEventListener('mouseup', stop);
        }

        setupCanvas(canH, strokesH, 'H');
        setupCanvas(canK, strokesK, 'K');

        async function checkSingle(type) {
            const strokes = (type === 'H') ? strokesH : strokesK;
            const target = (type === 'H') ? kanaData[curIdx].h : kanaData[curIdx].k;
            const box = document.getElementById(type === 'H' ? 'boxH' : 'boxK');
            if (strokes.length === 0 || (type === 'H' ? hiraDone : kataDone)) return;

            msg("辨識中...", "text-blue-400 loading-dot");

            try {
                const url = 'https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8';
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        options: "enable_pre_space",
                        requests: [{
                            writing_guide: { writing_area_width: 320, writing_area_height: 210 },
                            ink: strokes,
                            language: "ja"
                        }]
                    })
                });
                
                const data = await res.json();
                if (data[0] === "SUCCESS") {
                    const candidates = data[1][0][1];
                    const isOk = candidates.slice(0, 20).some(c => c.includes(target) || target.includes(c));

                    if (isOk) {
                        box.classList.add('is-correct');
                        if (type === 'H') hiraDone = true; else kataDone = true;
                        if (hiraDone && kataDone) {
                            msg("Perfect!", "text-green-400");
                            setTimeout(nextQ, 800);
                        } else {
                            msg("OK!", "text-blue-400");
                        }
                    } else {
                        box.classList.add('is-error');
                        msg("再試一次", "text-red-400");
                    }
                }
            } catch (e) {
                msg("連線不穩", "text-orange-400");
            }
        }

        function resetAll() {
            ctxH.clearRect(0,0,320,210); ctxK.clearRect(0,0,320,210);
            strokesH.length = 0; strokesK.length = 0;
            hiraDone = false; kataDone = false;
            document.getElementById('boxH').className = 'canvas-box';
            document.getElementById('boxK').className = 'canvas-box';
            msg("READY", "text-slate-500");
        }

        function render() {
            const q = kanaData[curIdx];
            document.getElementById('target-romaji').innerText = q.r;
            document.getElementById('hint-hira').innerText = q.h;
            document.getElementById('hint-kata').innerText = q.k;
            const isP = (mode === 'practice');
            document.getElementById('hint-hira').style.display = isP ? 'flex' : 'none';
            document.getElementById('hint-kata').style.display = isP ? 'flex' : 'none';
            resetAll();
        }

        function nextQ() { curIdx = (curIdx + 1) % kanaData.length; render(); }
        function setMode(m) { mode = m; document.getElementById('p-mode').className = `flex-1 py-1 rounded-lg font-bold text-xs ${m==='practice'?'active-mode':'text-slate-400'}`; document.getElementById('e-mode').className = `flex-1 py-1 rounded-lg font-bold text-xs ${m==='exam'?'active-mode':'text-slate-400'}`; render(); }
        function msg(t, c) { const m = document.getElementById('status-msg'); m.innerText = t; m.className = `h-6 text-sm font-bold mb-4 ${c} tracking-widest uppercase`; }

        render();
    </script>
</body>
</html>
