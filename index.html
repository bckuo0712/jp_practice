<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九州 5 天 4 夜精華遊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2D5A27; /* 森林綠 */
            --accent-color: #E67E22;  /* 橘色提醒 */
            --bg-color: #F8F9FA;
            --text-dark: #333;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Header 樣式 */
        header {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1542051841857-5f90071e7989?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        header h1 { margin: 0; font-size: 2rem; letter-spacing: 2px; }
        header p { margin: 10px 0 0; opacity: 0.9; }

        .container {
            max-width: 600px;
            margin: -30px auto 40px;
            padding: 0 15px;
        }

        /* 時間軸樣式 */
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .day-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }

        .day-badge {
            background: var(--primary-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }

        .spot-card {
            border-left: 3px solid #eee;
            margin-left: 10px;
            padding-left: 20px;
            padding-bottom: 20px;
            position: relative;
        }

        .spot-card::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 0;
            width: 13px;
            height: 13px;
            background: white;
            border: 3px solid var(--primary-color);
            border-radius: 50%;
        }

        .spot-card:last-child { border-left: none; padding-bottom: 0; }

        .spot-time {
            font-size: 0.85rem;
            color: #888;
            font-weight: bold;
        }

        .spot-name {
            display: block;
            font-size: 1.1rem;
            color: #2980b9;
            text-decoration: none;
            font-weight: 700;
            margin: 5px 0;
        }

        .spot-name i { font-size: 0.9rem; margin-left: 5px; }

        .desc { font-size: 0.95rem; color: #666; margin: 0; }

        /* 提醒區塊 */
        .memo-box {
            background: #FFF9E6;
            border: 1px solid #FFE58F;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .memo-box h4 { margin: 0 0 5px; color: #856404; font-size: 0.9rem; }
        .memo-box p { margin: 0; font-size: 0.85rem; color: #856404; }

        footer {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 0.8rem;
        }

        /* 動畫效果 */
        .day-section { transition: transform 0.3s ease; }
        .day-section:hover { transform: translateY(-5px); }

    </style>
</head>
<body>

<header
